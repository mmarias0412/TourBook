# Docker DNS: имена сервисов определяются при запросе,
# поэтому nginx не падает, если эти контейнеры ещё не запущены
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    # /api/tours...    -> сервис туров (Python)
    location /api/tours {
        set $tours http://tours:8000;
        proxy_pass $tours;
        proxy_set_header Host $host;
    }

    # /api/bookings... -> сервис бронирований (Python)
    location /api/bookings {
        set $bookings http://bookings:8000;
        proxy_pass $bookings;
        proxy_set_header Host $host;
    }

    # всё остальное -> страница сайта (nginx)
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
    }
}
